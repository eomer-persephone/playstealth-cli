name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check playstealth_actions playstealth_cli.py

      - name: Ruff (format check)
        # Codebase predates ruff format; we surface diffs without failing the build.
        continue-on-error: true
        run: ruff format --check playstealth_actions playstealth_cli.py

      - name: MyPy (type-check, advisory)
        continue-on-error: true
        run: mypy playstealth_actions

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke-import package
        run: |
          python -c "import playstealth_actions; print('package version', playstealth_actions.__version__)"
          python -c "from playstealth_actions.telemetry import log_event, get_summary; print('telemetry ok')"
          python -c "from playstealth_actions.resilience_config import ResilienceConfig; print('config ok')"
          python -c "from playstealth_actions.github_issue_reporter import GitHubIssueReporter; print('reporter ok')"
          python -c "from playstealth_actions.secret_manager import SecretManager; print('secret_manager ok')"
          python -c "from playstealth_actions.auto_heal_selector import AutoHealSelector; print('auto_heal ok')"

      - name: Run unit tests (no Playwright runtime required)
        run: |
          pytest -q \
            tests/test_resilience_config.py \
            tests/test_github_issue_reporter.py \
            tests/test_secret_manager.py \
            tests/test_auto_heal_selector.py

  security:
    name: Secret & repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no secret-like files are tracked
        run: |
          if git ls-files | grep -E '^(\.env(\..*)?|.*\.pem|.*\.key|.*credentials.*)$' ; then
            echo "::error::Tracked secret-like files detected"; exit 1
          fi
          echo "OK: no tracked secret files"

      - name: Validate .env.example only contains placeholders
        run: |
          if grep -E '^[A-Z_]+=[A-Za-z0-9+/=_-]{30,}$' .env.example | grep -vE 'your_|example|CHANGE_ME|PLACEHOLDER' ; then
            echo "::error::Real-looking values in .env.example"; exit 1
          fi
          echo "OK: .env.example clean"

      - name: Gitleaks scan (advisory)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: playstealth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: docker run --rm playstealth:ci --help
